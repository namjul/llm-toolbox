<!DOCTYPE html>
<html lang="en" class="h-full">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Paste to Markdown</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="https://esm.sh/prismjs@1.29.0/themes/prism.min.css" />
</head>

<body class="h-full bg-gray-50">
  <div id="app" class="h-full flex flex-col"></div>

  <script type="importmap">
  {
    "imports": {
      "spellcaster": "https://esm.sh/spellcaster@6.0.0",
      "spellcaster/hyperscript": "https://esm.sh/spellcaster@6.0.0/hyperscript.js",
      "dope": "https://esm.sh/gh/gordonbrander/dope",
      "turndown": "https://esm.sh/turndown@7.1.2",
      "prismjs": "https://esm.sh/prismjs@1.29.0",
      "prismjs/components/prism-markdown": "https://esm.sh/prismjs@1.29.0/components/prism-markdown.js",
      "prismjs/components/prism-bash": "https://esm.sh/prismjs@1.29.0/components/prism-bash.js",
      "@mozilla/readability": "https://esm.sh/@mozilla/readability@0.5.0"
    }
  }
  </script>

  <script type="module">
    import { signal, effect } from 'spellcaster'
    import { tags, text } from 'spellcaster/hyperscript'
    import TurndownService from 'turndown'
    import Prism from 'prismjs'
    import 'prismjs/components/prism-markdown'
    import 'prismjs/components/prism-bash'
    import { Readability } from '@mozilla/readability'
    import { get }  from 'dope'

    const { div, p, pre, button, input, label, span } = tags
    const turndown = new TurndownService({ headingStyle: 'atx' })

    // State
    const [mode, setMode] = signal('copy') // 'copy' | 'command'
    const [filename, setFilename] = signal('')
    const [prefixEnabled, setPrefixEnabled] = signal(localStorage.getItem('prefixEnabled') === 'true') // default: false
    const [prefix, setPrefix] = signal(localStorage.getItem('prefix') || '{author}')
    const [state, setState] = signal('empty') // 'empty' | 'loading' | { markdown, title, author, date, source }

    // Persist prefix settings
    effect(() => {
      localStorage.setItem('prefixEnabled', prefixEnabled())
    })
    effect(() => {
      localStorage.setItem('prefix', prefix())
    })

    const isUrl = (text) => {
      const trimmed = text.trim()
      return /^https?:\/\/\S+$/i.test(trimmed)
    }

    const slugify = (text) => {
      return text
        .toLowerCase()
        .trim()
        .replace(/[^\w\s-]/g, '')
        .replace(/\s+/g, '-')
        .replace(/-+/g, '-')
        .replace(/^-|-$/g, '')
    }

    const extractDate = (doc, article) => {
      if (article.publishedTime) return article.publishedTime

      const ogDate = doc.querySelector('meta[property="article:published_time"]')
      if (ogDate?.content) return ogDate.content

      const metaDate = doc.querySelector('meta[name="date"]')
      if (metaDate?.content) return metaDate.content

      const pubDate = doc.querySelector('meta[name="pubdate"]')
      if (pubDate?.content) return pubDate.content

      const schemaDate = doc.querySelector('meta[property="datePublished"]')
      if (schemaDate?.content) return schemaDate.content

      const jsonLd = doc.querySelector('script[type="application/ld+json"]')
      if (jsonLd) {
        try {
          const data = JSON.parse(jsonLd.textContent)
          const findDate = (obj) => {
            if (!obj || typeof obj !== 'object') return null
            if (obj.datePublished) return obj.datePublished
            if (Array.isArray(obj)) {
              for (const item of obj) {
                const found = findDate(item)
                if (found) return found
              }
            }
            return null
          }
          const found = findDate(data)
          if (found) return found
        } catch (e) {}
      }

      const timeEl = doc.querySelector('time[datetime]')
      if (timeEl?.datetime) return timeEl.datetime

      return null
    }

    const extractAuthor = (doc, article) => {
      // 1. Readability's byline
      if (article.byline) return article.byline

      // 2. meta name="author"
      const metaAuthor = doc.querySelector('meta[name="author"]')
      if (metaAuthor?.content) return metaAuthor.content

      // 3. Open Graph article:author
      const ogAuthor = doc.querySelector('meta[property="article:author"]')
      if (ogAuthor?.content) return ogAuthor.content

      // 4. JSON-LD author
      const jsonLd = doc.querySelector('script[type="application/ld+json"]')
      if (jsonLd) {
        try {
          const data = JSON.parse(jsonLd.textContent)
          const findAuthor = (obj) => {
            if (!obj || typeof obj !== 'object') return null
            if (obj.author) {
              if (typeof obj.author === 'string') return obj.author
              if (obj.author.name) return obj.author.name
              if (Array.isArray(obj.author) && obj.author[0]?.name) return obj.author[0].name
            }
            if (Array.isArray(obj)) {
              for (const item of obj) {
                const found = findAuthor(item)
                if (found) return found
              }
            }
            return null
          }
          const found = findAuthor(data)
          if (found) return found
        } catch (e) {}
      }

      // 5. rel="author" link
      const authorLink = doc.querySelector('a[rel="author"]')
      if (authorLink?.textContent) return authorLink.textContent.trim()

      return null
    }

    const formatDate = (dateStr) => {
      try {
        const date = new Date(dateStr)
        if (isNaN(date.getTime())) return null
        return date.toISOString().split('T')[0]
      } catch (e) {
        return null
      }
    }

    const buildMarkdown = (article, contentMd) => {
      const lines = []

      if (article.title) {
        lines.push(`title: ${article.title}`)
      }

      if (article.author) {
        lines.push(`author: ${article.author}`)
      }

      if (article.date) {
        const formatted = formatDate(article.date)
        if (formatted) {
          lines.push(`date: ${formatted}`)
        }
      }

      if (article.source) {
        lines.push(`source: ${article.source}`)
      }

      if (lines.length > 0) {
        return lines.join('\n') + '\n\n' + contentMd
      }

      return contentMd
    }

    const buildFileCommand = (prefix, filename, markdown) => {
      // Escape single quotes for shell: ' becomes '\''
      const escaped = markdown.replace(/'/g, "'\\''")
      const fullFilename = prefix ? `${prefix}.${filename}.md` : `${filename}.md`
      return `printf '%s' '${escaped}' > "${fullFilename}"`
    }

    const generateFilename = (title) => {
      if (title) {
        return slugify(title)
      }
      const now = new Date()
      return now.toISOString().split('T')[0].replace(/-/g, '.')
    }

    const resolvePrefix = (template, article) => {
      if (!template) return ''

      const now = new Date()
      const articleDate = article.date ? new Date(article.date) : now
      const dateStr = articleDate.toISOString().split('T')[0].replace(/-/g, '.')
      const [year, month, day] = articleDate.toISOString().split('T')[0].split('-')

      let domain = ''
      if (article.source) {
        try {
          domain = new URL(article.source).hostname.replace(/^www\./, '')
        } catch (e) {}
      }

      const variables = {
        author: article.author ? slugify(article.author) : '',
        title: article.title ? slugify(article.title) : '',
        date: dateStr,
        year,
        month,
        day,
        domain: domain ? slugify(domain) : ''
      }

      return template.replace(/\{(\w+)\}/g, (match, key) => {
        return variables[key] !== undefined ? variables[key] : match
      })
    }

    const isTwitterUrl = (url) => {
      try {
        const hostname = new URL(url).hostname
        return hostname === 'x.com' || hostname === 'twitter.com' ||
               hostname === 'www.x.com' || hostname === 'www.twitter.com'
      } catch (e) {
        return false
      }
    }

    const fetchTwitterContent = async (url) => {
      const oembedUrl = `https://publish.twitter.com/oembed?url=${encodeURIComponent(url)}`
      const response = await fetch(oembedUrl)
      if (!response.ok) return null

      const data = await response.json()
      // Extract text from the html blockquote
      const parser = new DOMParser()
      const doc = parser.parseFromString(data.html, 'text/html')
      const blockquote = doc.querySelector('blockquote')
      const tweetText = blockquote ? blockquote.textContent.trim() : ''

      return {
        content: tweetText,
        author: data.author_name,
        title: `Tweet by ${data.author_name}`,
        date: null,
        source: url
      }
    }

    const extractSubstackContent = (html) => {
      const preloadsMatch = html.match(/window\._preloads\s*=\s*JSON\.parse\("(.+?)"\)/)
      if (!preloadsMatch) return null

      try {
        const jsonStr = preloadsMatch[1].replace(/\\"/g, '"').replace(/\\\\/g, '\\')
        const preloads = JSON.parse(jsonStr)

        const post = get(preloads, ['post']) ?? get(preloads, ['feedData', 'initialPost', 'post'])
        if (post?.body_html) {
          return {
            content: post.body_html,
            title: post.title,
            date: post.post_date,
            author: post.publishedBylines?.[0]?.name
          }
        }
      } catch (e) {
        console.log('Failed to parse Substack preloads:', e)
      }
      return null
    }

    const fetchArticle = async (url) => {
      // Try Twitter/X.com via oEmbed (no CORS proxy needed)
      if (isTwitterUrl(url)) {
        const twitterContent = await fetchTwitterContent(url)
        if (twitterContent) {
          const markdown = buildMarkdown({
            title: twitterContent.title,
            author: twitterContent.author,
            date: twitterContent.date,
            source: url
          }, twitterContent.content)
          return { markdown, ...twitterContent }
        }
      }

      const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(url)}`
      const response = await fetch(proxyUrl)
      const html = await response.text()

      // Try Substack-specific extraction first
      const substackContent = extractSubstackContent(html)
      if (substackContent) {
        const contentMd = turndown.turndown(substackContent.content)
        const markdown = buildMarkdown({
          title: substackContent.title,
          author: substackContent.author,
          date: substackContent.date,
          source: url
        }, contentMd)
        return { markdown, title: substackContent.title, author: substackContent.author, date: substackContent.date, source: url }
      }

      // Fall back to Readability for other sites
      const parser = new DOMParser()
      const doc = parser.parseFromString(html, 'text/html')

      const base = new URL(url)
      doc.querySelectorAll('img[src]').forEach(img => {
        img.src = new URL(img.getAttribute('src'), base).href
      })
      doc.querySelectorAll('a[href]').forEach(a => {
        try {
          a.href = new URL(a.getAttribute('href'), base).href
        } catch (e) {}
      })

      const reader = new Readability(doc)
      const article = reader.parse()

      if (!article) {
        throw new Error('Could not extract article content')
      }

      const date = extractDate(doc, article)
      const author = extractAuthor(doc, article)
      const contentMd = turndown.turndown(article.content)
      const markdown = buildMarkdown({ title: article.title, author, date, source: url }, contentMd)

      return { markdown, title: article.title, author, date, source: url }
    }

    const selectAllContent = (element) => {
      const range = document.createRange()
      range.selectNodeContents(element)
      const selection = window.getSelection()
      selection.removeAllRanges()
      selection.addRange(range)
    }

    const handlePaste = async (event) => {
      event.preventDefault()
      const html = event.clipboardData.getData('text/html')
      const plainText = event.clipboardData.getData('text/plain')

      if (plainText && isUrl(plainText)) {
        setState('loading')
        try {
          const result = await fetchArticle(plainText.trim())
          setState(result)
        } catch (error) {
          setState({ markdown: `Error: ${error.message}`, title: null, author: null })
        }
        return
      }

      if (html) {
        const md = turndown.turndown(html)
        setState({ markdown: md, title: null, author: null })
      } else if (plainText) {
        setState({ markdown: plainText, title: null, author: null })
      }
    }

    const reset = () => {
      setState('empty')
    }

    const Header = () => {
      // Mode buttons (need refs for dynamic className)
      const copyBtn = button(
        { className: 'px-3 py-1 rounded text-sm', onclick: () => setMode('copy') },
        text('Copy')
      )
      const commandBtn = button(
        { className: 'px-3 py-1 rounded text-sm', onclick: () => setMode('command') },
        text('Command')
      )

      // Prefix input (needs ref for show/hide effect)
      const prefixInput = input({
        type: 'text',
        className: 'px-2 py-1 border border-gray-300 rounded text-sm w-32',
        placeholder: '{author}',
        value: prefix(),
        oninput: (e) => setPrefix(e.target.value),
        onblur: () => {
          const output = document.querySelector('#app pre[contenteditable]')
          if (output) {
            output.focus()
            selectAllContent(output)
          }
        }
      })

      // Filename input (needs ref for auto-populate effect)
      const filenameInput = input({
        type: 'text',
        className: 'px-2 py-1 border border-gray-300 rounded text-sm w-64',
        placeholder: generateFilename(),
        oninput: (e) => setFilename(e.target.value),
        onblur: () => {
          const output = document.querySelector('#app pre[contenteditable]')
          if (output) {
            output.focus()
            selectAllContent(output)
          }
        }
      })

      // Containers (need refs for show/hide effects)
      const prefixContainer = div(
        { className: 'flex items-center gap-2' },
        [
          label(
            { className: 'text-sm text-gray-600 flex items-center gap-1' },
            [
              input({
                type: 'checkbox',
                className: 'w-4 h-4',
                checked: prefixEnabled(),
                onchange: (e) => setPrefixEnabled(e.target.checked)
              }),
              span({}, text('Prefix:'))
            ]
          ),
          prefixInput
        ]
      )

      const filenameContainer = div(
        { className: 'flex items-center gap-2' },
        [
          label({ className: 'text-sm text-gray-600' }, text('Filename:')),
          filenameInput,
          span({ className: 'text-sm text-gray-600' }, text('.md'))
        ]
      )

      // Effects for dynamic updates
      effect(() => {
        prefixInput.style.display = prefixEnabled() ? 'block' : 'none'
      })

      effect(() => {
        const current = state()
        if (current !== 'empty' && current !== 'loading' && current.title) {
          const generated = generateFilename(current.title)
          if (!filename()) {
            filenameInput.value = generated
            setFilename(generated)
          }
        }
      })

      effect(() => {
        const currentMode = mode()
        copyBtn.className = `px-3 py-1 rounded text-sm ${currentMode === 'copy' ? 'bg-blue-500 text-white' : 'bg-gray-200 text-gray-700'}`
        commandBtn.className = `px-3 py-1 rounded text-sm ${currentMode === 'command' ? 'bg-blue-500 text-white' : 'bg-gray-200 text-gray-700'}`
        prefixContainer.style.display = currentMode === 'command' ? 'flex' : 'none'
        filenameContainer.style.display = currentMode === 'command' ? 'flex' : 'none'
      })

      return div(
        { className: 'flex items-center gap-4 p-4 bg-white border-b border-gray-200' },
        [
          div({ className: 'flex items-center gap-2' }, [copyBtn, commandBtn]),
          prefixContainer,
          filenameContainer
        ]
      )
    }

    const Content = () => {
      const container = div(
        { className: 'flex-1 flex items-center justify-center p-10 overflow-hidden' }
      )

      let lastState = null
      let lastMode = null

      effect(() => {
        const current = state()
        const currentMode = mode()
        const currentFilename = filename()
        const currentPrefixEnabled = prefixEnabled()
        const currentPrefix = prefix()
        const shouldAutoSelect = current !== lastState || currentMode !== lastMode
        lastState = current
        lastMode = currentMode

        container.innerHTML = ''

        if (current === 'empty') {
          container.appendChild(
            p({ className: 'text-gray-400 text-2xl select-none' }, text('Paste content or URL (Ctrl+V)'))
          )
        } else if (current === 'loading') {
          container.appendChild(
            p({ className: 'text-gray-400 text-2xl select-none' }, text('Loading article...'))
          )
        } else {
          const { markdown, title, author, date, source } = current
          const effectiveFilename = currentFilename || generateFilename(title)
          const resolvedPrefix = currentPrefixEnabled ? resolvePrefix(currentPrefix, { title, author, date, source }) : ''
          const outputText = currentMode === 'command'
            ? buildFileCommand(resolvedPrefix, effectiveFilename, markdown)
            : markdown

          const lang = currentMode === 'command' ? 'bash' : 'markdown'
          const grammar = currentMode === 'command' ? Prism.languages.bash : Prism.languages.markdown

          const output = pre({
            className: 'w-full h-full p-6 bg-white rounded-lg shadow-sm overflow-auto !whitespace-pre-wrap !break-words font-mono text-sm focus:outline-none',
            contentEditable: 'true',
            onkeydown: (e) => { if (e.key === 'Escape') reset() },
            oncopy: (e) => {
              e.preventDefault()
              e.clipboardData.setData('text/plain', outputText)
            }
          })
          output.innerHTML = Prism.highlight(outputText, grammar, lang)
          container.appendChild(output)

          if (shouldAutoSelect) {
            requestAnimationFrame(() => {
              output.focus()
              selectAllContent(output)
            })
          }
        }
      })

      return container
    }

    const App = () => div(
      { className: 'h-full flex flex-col' },
      [Header(), Content()]
    )

    document.getElementById('app').appendChild(App())

    document.addEventListener('paste', handlePaste)
  </script>

</body>

</html>
